[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-detection"
version = "1.0.0"
description = "Pixel-wise fire detection in images using a supervised SVM classifier."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yasaman Honarparvar" }]
dependencies = [
    "imageio>=2.31",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
fire-detect = "fire_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
